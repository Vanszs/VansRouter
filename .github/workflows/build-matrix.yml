name: Cross-platform build matrix

on:
  push:
    branches: [main, master, dev]
    paths:
      - "cli/**"
      - "scripts/build.js"
      - "scripts/deploy-atomic.cjs"
      - "scripts/verify-release-artifact.cjs"
      - "scripts/fix-standalone-symlinks.cjs"
      - "tests/unit/deploy-atomic.test.js"
      - "tests/unit/performance-boundaries.test.js"
      - "src/lib/dataDir.js"
      - "src/lib/db/**"
      - "src/app/api/usage/stream/route.js"
      - "src/app/masuk/MasukClient.js"
      - "src/shared/components/layouts/DashboardLayout.js"
      - "open-sse/utils/sseConstants.js"
      - "src/proxy.js"
      - "src/mitm/**"
      - "server.js"
      - "custom-server.js"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".gitattributes"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "cli/**"
      - "scripts/build.js"
      - "scripts/deploy-atomic.cjs"
      - "scripts/verify-release-artifact.cjs"
      - "scripts/fix-standalone-symlinks.cjs"
      - "tests/unit/deploy-atomic.test.js"
      - "tests/unit/performance-boundaries.test.js"
      - "src/lib/dataDir.js"
      - "src/lib/db/**"
      - "src/app/api/usage/stream/route.js"
      - "src/app/masuk/MasukClient.js"
      - "src/shared/components/layouts/DashboardLayout.js"
      - "open-sse/utils/sseConstants.js"
      - "src/proxy.js"
      - "src/mitm/**"
      - "server.js"
      - "custom-server.js"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".gitattributes"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
        # Note: setup-node's pnpm cache requires a workspace "packages" field,
        # which this repo does not use. pnpm/action-setup handles installation.

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ matrix.node }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-pnpm-

      - name: Configure pnpm hoisting config
        shell: bash
        run: |
          echo "public-hoist-pattern=*" >> .npmrc
          echo "shamefully-hoist=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run no-undef lint (catch undefined before build)
        run: pnpm lint:undef

      - name: Build application
        run: node scripts/build.js

      - name: Verify standalone output exists
        shell: bash
        run: |
          test -d .next/standalone
          test -f .next/standalone/server.js
